services:
  openclaw:
    build: .
    restart: unless-stopped
    # Claude Code's Bash sandbox shells out to bubblewrap, which first creates a
    # user + mount namespace and then does mount work inside it; two container
    # layers deny those two steps in sequence, and measurement on 2026-09-13
    # showed neither relaxation works alone. seccomp: Docker's builtin profile
    # allows clone/unshare carrying a CLONE_NEW* bit only under CAP_SYS_ADMIN,
    # which this container does not have, so namespace creation returns EPERM —
    # hence ./seccomp-userns.json, which is moby/profiles seccomp/default.json
    # plus exactly one entry (clone, unshare, mount, umount2, pivot_root), so the
    # filter stays enforcing instead of switched off; apparmor=unconfined then
    # clears docker-default's denial of bwrap's `mount --make-rslave /`, and has
    # no compose-only tighter form because a custom AppArmor profile has to be
    # loaded on the host with apparmor_parser first. The trade is real: after
    # this the container itself is confined by neither AppArmor nor the full
    # default seccomp profile. `sandbox.enableWeakerNestedSandbox` stays true in
    # claude-code/managed-settings.json — measured 2026-09-13, even with both
    # layers relaxed a fresh /proc in a new PID namespace still fails with
    # `Can't mount proc on /newroot/proc: Operation not permitted`, the exact
    # error that key exists for (code.claude.com/docs/en/sandboxing,
    # Troubleshooting).
    security_opt:
      - seccomp=./seccomp-userns.json
      - apparmor=unconfined
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      # gbrain-serve shares this container's network namespace (see that
      # service), so the brain's 3131 is published from here. Loopback only,
      # and 3131 because the host is a thin client of this brain (gbrain init --mcp-only): the issuer is http://localhost:3131 and must be true for the host too.
      - "127.0.0.1:3131:3131"
    env_file: .env
    volumes:
      # Persistent data survives container restarts (like Render disks)
      - openclaw-data:/data

  # Infrastructure sibling for gbrain. Not part of the Render deploy path
  # (render.yaml is a single web service); this runs alongside openclaw only
  # under Compose. The openclaw service above is deliberately untouched — the
  # two reach each other over the project's default network by service name.
  gbrain-postgres:
    image: pgvector/pgvector:pg16
    container_name: gbrain-postgres
    restart: unless-stopped
    # POSTGRES_PASSWORD lives here only. Never in this file, git, or the image.
    # See .env.gbrain-postgres.example.
    env_file: .env.gbrain-postgres
    environment:
      POSTGRES_DB: gbrain
      POSTGRES_USER: gbrain
    volumes:
      - gbrain-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbrain -d gbrain"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Host-side maintenance access, loopback only. Off by default: gbrain
    # reaches the DB over the Docker network, so nothing needs a host port.
    # ports:
    #   - "127.0.0.1:5434:5432"

  # Durable HTTP MCP endpoint for the brain.
  #
  # Shape is upstream's: gbrain docs/mcp/DEPLOY.md "Co-located Docker
  # workloads" puts the brain's Postgres and `gbrain serve` together on one
  # user-defined network, and has every other workload reach the brain over
  # OAuth against serve rather than over a database connection.
  #
  # Why a service and not a process inside the openclaw container: serve had
  # been an ad-hoc child of whichever agent session started it, so it died
  # with that session. Every OAuth-scoped client points at this endpoint, so
  # its lifetime has to be the stack's, not a session's.
  #
  # Image-owned runtime: gbrain-serve/Dockerfile installs gbrain exactly as
  # INSTALL_FOR_AGENTS.md Step 1 prescribes, pinned by commit. The openclaw
  # volume is still mounted read-only only so the embedding key can be read
  # from /data/.env; HOME is a separate small volume for serve's own state.
  gbrain-serve:
    build: ./gbrain-serve
    image: openclaw-stack-gbrain-serve
    container_name: gbrain-serve
    restart: unless-stopped
    # Shares the openclaw container's network namespace. gbrain's OAuth issuer
    # must be HTTPS or localhost — serve exits with "Issuer URL must be HTTPS"
    # for any other --public-url, and without one it advertises
    # http://localhost:3131 — so the only way a plain-HTTP, no-hostname
    # deployment can complete the client-credentials flow is for "localhost"
    # to be TRUE for the caller. Inside openclaw the brain is therefore
    # http://localhost:3131: the URL the thin client (`gbrain init --mcp-only`)
    # and OpenClaw's mcp.servers entry both use. Postgres is still reached by
    # service name over the project network openclaw is attached to.
    network_mode: "service:openclaw"
    depends_on:
      openclaw:
        condition: service_started
      gbrain-postgres:
        condition: service_healthy
    env_file: .env.gbrain-postgres
    environment:
      HOME: /gbrain-home
      # This server is a "stateless host" in gbrain's sense: its HOME is a
      # fresh volume with no config.json, so embedding_model and
      # embedding_dimensions cannot resolve from the file plane and have to
      # come from the environment. The server says so itself at startup, and
      # without them it answers "vector search unavailable (missing_env)" and
      # degrades every caller to keyword-only — which reads as an agent that
      # ignores the brain rather than a server that cannot embed a query.
      #
      # These MUST match the brain's own schema
      # (/data/.gbrain/config.json in the openclaw volume). A mismatch does
      # not fail loudly; it writes vectors the existing index cannot use.
      GBRAIN_EMBEDDING_MODEL: voyage:voyage-4-large
      GBRAIN_EMBEDDING_DIMENSIONS: "1024"
    volumes:
      # Read-write: the brain's `workspace` source has local_path
      # /data/.openclaw/brain, and the server writes a page's markdown into
      # its source's local_path (put_page failed with EROFS while this was
      # :ro). The embedding key is also read from /data/.env at start.
      - openclaw-data:/data
      - gbrain-serve-home:/gbrain-home
    # No ports here: a service in another container's network namespace
    # cannot publish its own; the host mapping lives on the openclaw service.
    # GBRAIN_DATABASE_URL comes from .env.gbrain-postgres (gitignored, next to
    # POSTGRES_PASSWORD) — ENGINES.md: "GBRAIN_DATABASE_URL is always stated
    # intent". Nothing secret-shaped lives in this file.
    # The embedding key is read out of the volume at start, never through
    # Compose and never into a log. Without it the server answers
    # "vector search unavailable (missing_env)" and silently degrades every
    # client to keyword-only retrieval — which looks like an agent that
    # ignores the brain rather than a server that cannot embed a query.
    # Measured: a probe agent searched the brain eight times unprompted and
    # surfaced nothing, purely because of this.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        VOYAGE_API_KEY=$$(sed -n 's/^VOYAGE_API_KEY=//p' /data/.env | head -1);
        export VOYAGE_API_KEY;
        [ -x /gbrain-home/.gbrain/start-autopilot.sh ] && bash /gbrain-home/.gbrain/start-autopilot.sh;
        exec /usr/bin/tini -- gbrain serve --http --port 3131 --bind 0.0.0.0
    # The autopilot line is the "ONE LINE in your agent bootstrap" that
    # `gbrain autopilot --install` prints on an ephemeral-container host
    # (skills/setup/SKILL.md): the daemon (sync + extract + embed, supervising
    # the minions worker) runs on the brain host, which is this container.
    # The start script lives on the gbrain-serve-home volume, so a recreate
    # keeps it; absence just means autopilot was never installed.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3131/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  openclaw-data:
  gbrain-serve-home:
  gbrain-pgdata:
    name: gbrain-pgdata
